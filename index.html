    <script>
      // Defend against buggy browser extensions in iframe environments
      (function() {
        // Prevent "Cannot set property fetch of #<Window> which has only a getter"
        try {
          if (typeof window !== 'undefined') {
            const desc = Object.getOwnPropertyDescriptor(window, 'fetch');
            if (desc && !desc.writable && !desc.set) {
              const originalFetch = window.fetch;
              Object.defineProperty(window, 'fetch', {
                get() { return originalFetch; },
                set() { /* absorb silently */ },
                configurable: true
              });
            }
          }
        } catch(e) {}

        // Shield chrome and browser polyfills
        try {
          if (typeof window !== 'undefined') {
            window.chrome = window.chrome || {};
            window.browser = window.browser || {};
            if (!window.browser.runtime) {
              window.browser.runtime = {
                getManifest: function() { return { version: "1.0" }; },
                getURL: function(path) { return path; },
                sendMessage: function() { return Promise.resolve(); }
              };
            }
          }
        } catch(e) {}

        // Global early event interceptor for extension errors
        if (typeof window !== 'undefined') {
          window.addEventListener('error', function(event) {
            var msg = event.message || '';
            var filename = event.filename || '';
            if (
              filename.indexOf('chrome-extension:') !== -1 ||
              filename.indexOf('moz-extension:') !== -1 ||
              msg.indexOf('browser_polyfill') !== -1 ||
              msg.indexOf('getManifest') !== -1 ||
              msg.indexOf('fetch') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);
        }
      })();
